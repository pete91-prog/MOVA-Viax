name: HACS Action

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"

jobs:
  hacs:
    name: HACS Action
    runs-on: "ubuntu-latest"
    steps:
      - name: HACS Action
        uses: "hacs/action@main"
        with:
          category: "integration"
          # These three checks read GitHub repository settings (About + license
          # detection), which cannot be set from this PR. Remove the ignores
          # after main has a LICENSE file and the repo description/topics are set.
          ignore: "topics,description,license"